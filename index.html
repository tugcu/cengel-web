<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Çengel Bulmaca">
  <meta name="theme-color" content="#2e7d32">
  <meta name="description" content="Çengel Bulmaca. Bu oyun annem Hacer Tuğcu'ya hediyemdir. © 2026 Tuna Tuğcu.">
  <title>Çengel Bulmaca</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1 id="topic">Yükleniyor...</h1>
      <p id="remaining" class="remaining"></p>
    </header>

    <div class="buttons">
      <button id="newBtn" type="button" disabled>Yeni Oyun</button>
      <button id="revealBtn" type="button">Çözümü Göster</button>
    </div>

    <p id="status" class="status" aria-live="polite"></p>

    <div id="boardWrap" class="board-wrap">
      <div id="board" class="board" aria-label="Bulmaca ızgarası"></div>
    </div>

    <h2>Yatay</h2>
    <div id="across" class="clues"></div>

    <h2>Dikey</h2>
    <div id="down" class="clues"></div>
  </main>

  <input id="kb" class="kb" type="text" inputmode="text" autocomplete="off" autocorrect="off"
         autocapitalize="characters" spellcheck="false" aria-hidden="true" tabindex="-1">

  <div id="welcome" class="overlay" role="dialog" aria-modal="true" aria-labelledby="giftText">
    <div class="card">
      <p id="giftText" class="gift">Bu Çengel Bulmaca oyunu annem Hacer Tuğcu'ya hediyemdir.</p>
      <p class="copy">© 2026 Tuna Tuğcu. Tüm hakları saklıdır.</p>
      <p class="copy" id="appVersion"></p>
      <button id="startBtn" type="button">Başla</button>
    </div>
  </div>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
